[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["migrations"]

[tool.ruff.lint]
# E/W = PEP8 (pycodestyle), F = pyflakes, I = import order, N = naming, ANN = type annotations
select = ["E", "W", "F", "I", "N", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"apps/*/apps.py" = ["ANN"]
